<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ভিডিও চলছে...</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    html, body { overscroll-behavior: none; }
    .yt-wrap {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* 16:9 */
        background: #000;
        overflow: hidden;
    }
    .yt-wrap iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }
    .overlay-top {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 60px;
        z-index: 10;
        pointer-events: none;
    }
    .timer-ring-bg { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 8; }
    .timer-ring-progress { fill: none; stroke: #8b5cf6; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.35s ease; }
</style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-900 to-black min-h-screen flex flex-col">

<!-- ═══ Top Status Bar ═══ -->
<div class="bg-gradient-to-r from-red-600 to-red-700 text-white p-3 text-center shadow-lg">
    <div class="flex items-center justify-center gap-2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M23.5 6.2c-.3-1-1-1.8-2-2.1C19.7 3.5 12 3.5 12 3.5s-7.7 0-9.5.6c-1 .3-1.7 1.1-2 2.1C0 8 0 12 0 12s0 4 .5 5.8c.3 1 1 1.8 2 2.1 1.8.6 9.5.6 9.5.6s7.7 0 9.5-.6c1-.3 1.7-1.1 2-2.1.5-1.8.5-5.8.5-5.8s0-4-.5-5.8zM9.5 15.5v-7l6 3.5-6 3.5z"/></svg>
        <span class="font-bold text-sm" id="headerTaskTitle">YouTube Video Task</span>
    </div>
</div>

<!-- ═══ YouTube Video Player ═══ -->
<div class="w-full bg-black relative" id="playerWrap">
    <div class="yt-wrap" id="ytContainer">
        <iframe id="ytFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
    <!-- Disabled click overlay to prevent pausing -->
    <div id="clickBlocker" style="position:absolute;inset:0;z-index:5;cursor:not-allowed;background:transparent;"></div>
</div>

<!-- ═══ Timer Section ═══ -->
<div class="flex-1 flex flex-col items-center justify-center p-5">

    <!-- Progress Ring -->
    <div class="relative" style="width: 160px; height: 160px;">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 160 160">
            <circle cx="80" cy="80" r="70" class="timer-ring-bg"></circle>
            <circle id="timerProgress" cx="80" cy="80" r="70" class="timer-ring-progress"></circle>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
            <div id="timerText" class="text-3xl font-black text-white tabular-nums">00:00</div>
            <div class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">remaining</div>
        </div>
    </div>

    <!-- Info -->
    <div class="mt-6 text-center">
        <p class="text-white text-base font-bold mb-1" id="taskTitleDisplay">ভিডিও চলছে...</p>
        <p class="text-gray-400 text-xs font-semibold">ভিডিও বন্ধ করবেন না — টাইমার শেষ হলে রিওয়ার্ড পাবেন</p>
    </div>

    <!-- Reward Pill -->
    <div class="mt-4 flex items-center gap-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white px-5 py-2 rounded-full shadow-lg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        <span class="font-black text-sm">+<span id="rewardDisplay">5</span> TK</span>
    </div>

    <!-- Warning -->
    <div class="mt-6 max-w-md bg-red-900/40 border border-red-500/30 rounded-xl p-3 flex items-start gap-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ef4444" class="shrink-0 mt-0.5"><path d="M12 2L1 21h22L12 2zm0 6l7.53 13H4.47L12 8zm-1 4v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
        <p class="text-red-300 text-xs font-semibold leading-relaxed">⚠️ এই পেজ মাঝপথে বন্ধ করলে বা ভিডিও স্কিপ করলে রিওয়ার্ড পাবেন না।</p>
    </div>

    <!-- Cancel -->
    <button onclick="cancelYoutubeTask()" class="mt-5 px-6 py-2.5 bg-white/10 hover:bg-white/20 text-white text-sm font-bold rounded-xl border border-white/10 transition">
        ❌ বাতিল করুন
    </button>
</div>

<!-- ═══ Success Screen ═══ -->
<div id="successScreen" class="hidden fixed inset-0 z-50 bg-gradient-to-br from-green-600 to-emerald-700 flex items-center justify-center p-6">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
        <div class="text-7xl mb-4">✅</div>
        <h2 class="text-2xl font-black text-green-600 mb-2">ভিডিও সম্পন্ন!</h2>
        <p class="text-gray-600 mb-5 text-sm font-semibold">রিওয়ার্ড প্রস্তুত হচ্ছে... অপেক্ষা করুন</p>
        <div class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// Load pending task data from localStorage
// ═══════════════════════════════════════════════════════
let pending = null;
try {
    const raw = localStorage.getItem('pending_youtube');
    if (raw) pending = JSON.parse(raw);
} catch (e) {}

if (!pending) {
    alert('⚠️ টাস্ক ডেটা পাওয়া যায়নি। আবার চেষ্টা করুন।');
    location.href = 'index.html';
}

// ═══════════════════════════════════════════════════════
// Extract YouTube video ID from URL
// ═══════════════════════════════════════════════════════
function extractYouTubeId(url) {
    if (!url) return null;
    const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/v\/)([A-Za-z0-9_-]{11})/,
        /[?&]v=([A-Za-z0-9_-]{11})/
    ];
    for (const p of patterns) {
        const m = url.match(p);
        if (m && m[1]) return m[1];
    }
    return null;
}

const videoId = extractYouTubeId(pending.url || '');

// ═══════════════════════════════════════════════════════
// Setup UI
// ═══════════════════════════════════════════════════════
document.getElementById('headerTaskTitle').textContent = pending.taskTitle || 'YouTube Video Task';
document.getElementById('taskTitleDisplay').textContent = pending.taskTitle || 'ভিডিও চলছে...';
document.getElementById('rewardDisplay').textContent = Number(pending.reward || 0).toFixed(2);

// ═══════════════════════════════════════════════════════
// Embed YouTube video — autoplay, no controls, no keyboard, no fullscreen
// ═══════════════════════════════════════════════════════
if (!videoId) {
    alert('⚠️ এই টাস্কে বৈধ YouTube ভিডিও লিংক নেই।');
    // Still redirect back after warning
    setTimeout(() => { location.href = 'index.html'; }, 2000);
} else {
    const embedParams = [
        'autoplay=1',
        'mute=0',
        'controls=0',
        'disablekb=1',
        'modestbranding=1',
        'rel=0',
        'playsinline=1',
        'fs=0',
        'iv_load_policy=3',
        'loop=1',
        'playlist=' + videoId,
        'showinfo=0'
    ].join('&');
    document.getElementById('ytFrame').src = 'https://www.youtube.com/embed/' + videoId + '?' + embedParams;
}

// ═══════════════════════════════════════════════════════
// Timer Logic
// ═══════════════════════════════════════════════════════
const totalSeconds = parseInt(pending.timer) || 60;
let seconds = totalSeconds;

// Progress ring
const R = 70;
const circumference = 2 * Math.PI * R;
const ringProgress = document.getElementById('timerProgress');
ringProgress.style.strokeDasharray = circumference;
ringProgress.style.strokeDashoffset = 0;

// Initial display
function fmt(t) {
    const m = String(Math.floor(t / 60)).padStart(2, '0');
    const s = String(t % 60).padStart(2, '0');
    return m + ':' + s;
}
document.getElementById('timerText').textContent = fmt(seconds);

// Prevent leaving early
let completed = false;
window.addEventListener('beforeunload', (e) => {
    if (!completed) {
        e.preventDefault();
        e.returnValue = '';
        return '';
    }
});

// Visual feedback when user tries to leave
document.addEventListener('visibilitychange', () => {
    if (document.hidden && !completed) {
        console.log('⚠️ Page hidden — user switched apps');
    }
});

// ═══════════════════════════════════════════════════════
// Start countdown
// ═══════════════════════════════════════════════════════
const timerInterval = setInterval(() => {
    seconds--;
    const remain = Math.max(0, seconds);
    document.getElementById('timerText').textContent = fmt(remain);
    const progress = (totalSeconds - remain) / totalSeconds;
    ringProgress.style.strokeDashoffset = circumference * progress;
    if (seconds <= 0) {
        clearInterval(timerInterval);
        onComplete();
    }
}, 1000);

// ═══════════════════════════════════════════════════════
// On Complete — save flag and return to index.html
// ═══════════════════════════════════════════════════════
function onComplete() {
    completed = true;
    // Set localStorage flag — index.html will detect and award automatically
    localStorage.setItem('youtube_done_task', String(pending.taskId));
    // Show success screen
    document.getElementById('successScreen').classList.remove('hidden');
    // Redirect after 1.5s
    setTimeout(() => {
        location.href = 'index.html';
    }, 1500);
}

// ═══════════════════════════════════════════════════════
// Cancel — clear pending, no reward
// ═══════════════════════════════════════════════════════
function cancelYoutubeTask() {
    if (!confirm('বাতিল করলে রিওয়ার্ড পাবেন না। বাতিল করবেন?')) return;
    completed = true;
    localStorage.removeItem('pending_youtube');
    localStorage.removeItem('youtube_done_task');
    location.href = 'index.html';
}

// Block right-click context menu on video
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
